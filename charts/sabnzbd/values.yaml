# yaml-language-server: $schema=../../values.schema.json
#
# Secrets to create
#
secrets:
  - name: 'apiKey'
    value: 'apiKey'
    # ref: 'sabnzbd-api' # existing secret
  - name: 'nzbKey'
    value: 'nzbKey'
    # ref: 'sabnzbd-api' # existing secret
  - name: 'newsreaderServerPassword'
    value: 'password123'
    # ref: 'sabnzbd-newsreader' # existing secret

#
# Application Config
#
application:
  # main application web ui port
  port: 8080
  # access url base
  urlBase: 'sabnzbd'
  # ConfigMap for core application settings
  config:
    # Filename of configuration
    filename: 'sabnzbd.ini'
    # Configuration file contents
    contents: |
      [misc]
      language = en
      queue_limit = 20
      port = 8080
      api_key = $apiKey
      nzb_key = $nzbKey
      download_dir = Downloads/incomplete
      complete_dir = Downloads/complete
      host_whitelist =
      # [servers]
      # [[yournewsreader.example.org]]
      # name = yournewsreader.example.org
      # displayname = yourNewsReader
      # host = yournewsreader.example.org
      # port = 563
      # username = username
      # password = $newsreaderServerPassword
      # connections = 8
      # ssl = 1
      # ssl_verify = 2
      # enable = 1
      # priority = 0
    secrets: [ 'apiKey', 'nzbKey', 'newsreaderServerPassword' ]
    # path the file will be mounted to in the config
    mountPath: '/config/sabnzbd.ini'

#
# Resource - DEPLOYMENT
# This is to set up and define the application deployment
#
deployment:
  container:
    image:
      repository: 'lscr.io/linuxserver/sabnzbd'

    env:
      - name: 'PGID'
        value: '1000'
      - name: 'PUID'
        value: '1000'
      - name: 'TZ'
        value: 'UTC'

    # Deliberately unprefixed: the sabnzbd.ini above sets no url_base, so
    # SABnzbd serves at the root. application.urlBase only sets the ingress
    # path here, not a path the app itself answers on.
    #
    # The query string is fine - kubelet parses it off the path. /api?mode=version
    # needs no API key and answers 200 with the version.
    #
    # If you set host_whitelist in the ini, SABnzbd will 403 a request for any
    # hostname outside it. Probes still pass: kubelet sends the pod IP, which
    # SABnzbd permits. A probe with an explicit Host httpHeader would not.
    livenessProbe:
      httpGet:
        path: '/api?mode=version'
        port: 'http'
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: '/api?mode=version'
        port: 'http'
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    # Additional volumeMounts on the output Deployment definition.
    volumeMounts:
      - name: 'config'
        mountPath: '/config'
      - name: 'downloads'
        mountPath: '/config/Downloads'

  volumes:
    config:
      persistentVolumeClaim:
        claimName: 'sabnzbd-config'
    # Mounted at /config/Downloads to match the relative download_dir in the
    # ini above. Replace this with the volume your library tools read from -
    # an emptyDir loses every download on restart.
    downloads:
      emptyDir: {}

persistentVolumeClaims:
  sabnzbd-config:
    accessMode: 'ReadWriteOnce'
    requestStorage: '1Gi'
    selector: {}

ingress:
  enabled: true

metrics:
  enabled: true
  app: 'sabnzbd'
  port:
    number: 9707
