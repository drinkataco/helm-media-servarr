# yaml-language-server: $schema=../../values.schema.json
# Default library values
nameOverride: ''
fullnameOverride: ''

#
# Application Config
#
application:
  # Main application web UI port
  port: 7575

#
# Resource - DEPLOYMENT
# This is to set up and define the application deployment
#
deployment:
  container:
    image:
      repository: 'ghcr.io/homarr-labs/homarr'

    env:
      - name: 'TZ'
        value: 'UTC'
      # Required. Homarr will not start without it. The Secret is not created
      # by this chart; create it before installing:
      #   kubectl create secret generic homarr-encryption-key \
      #     --from-literal=secretEncryptionKey="$(openssl rand -hex 32)"
      # Changing the key makes everything already encrypted unreadable.
      - name: 'SECRET_ENCRYPTION_KEY'
        valueFrom:
          secretKeyRef:
            name: 'homarr-encryption-key'
            key: 'secretEncryptionKey'

    livenessProbe:
      httpGet:
        path: '/api/health/live'
        port: 'http'
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        path: '/api/health/ready'
        port: 'http'
      initialDelaySeconds: 15

    # Additional volumeMounts on the output Deployment definition.
    volumeMounts:
      - name: 'data'
        mountPath: '/appdata'

  volumes:
    # Database, Redis dump and trusted certificates
    data:
      persistentVolumeClaim:
        claimName: 'homarr-data'

persistentVolumeClaims:
  homarr-data:
    accessMode: 'ReadWriteOnce'
    requestStorage: '1Gi'
    selector: {}

ingress:
  enabled: true
  host: 'homarr.local'
  path: '/'
