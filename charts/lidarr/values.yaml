# yaml-language-server: $schema=../../values.schema.json
# Default library values
nameOverride: ''
fullnameOverride: ''

#
# Secrets to create
#
secrets:
  - name: 'apiKey'
    value: ''
    # ref: 'my-existing-secret' # existing secret

#
# Application Config
#
application:
  # Main application web UI port
  port: 8686
  # Access url base
  urlBase: 'lidarr'
  # ConfigMap for core application settings
  config:
    # Filename of configuration
    filename: 'config.xml'
    # Configuration file contents
    contents: |
      <Config>
        <LogLevel>info</LogLevel>
        <EnableSsl>False</EnableSsl>
        <Port>8686</Port>
        <UrlBase>lidarr</UrlBase>
        <BindAddress>*</BindAddress>
        <ApiKey>$apiKey</ApiKey>
        <AnalyticsEnabled>False</AnalyticsEnabled>
        <AuthenticationMethod>External</AuthenticationMethod>
        <UpdateMechanism>Docker</UpdateMechanism>
        <Branch>main</Branch>
        <InstanceName>Lidarr</InstanceName>
      </Config>
    # Secrets to inject - if any - to the config. In the config they must be defined as $secret
    secrets: [ 'apiKey' ]
    # Path the file will be mounted to in the config
    mountPath: '/config/config.xml'

#
# Resource - DEPLOYMENT
# This is to set up and define the application deployment
#
deployment:
  container:
    image:
      repository: 'lscr.io/linuxserver/lidarr'

    env:
      - name: 'PGID'
        value: '1000'
      - name: 'PUID'
        value: '1000'
      - name: 'TZ'
        value: 'UTC'

    # Path matches <UrlBase>lidarr</UrlBase> in config.xml above - change both
    # together, along with application.urlBase.
    livenessProbe:
      httpGet:
        path: '/lidarr/ping'
        port: 'http'
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: '/lidarr/ping'
        port: 'http'
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    # Additional volumeMounts on the output Deployment definition.
    volumeMounts:
      - name: 'config'
        mountPath: '/config'
      - name: 'downloads'
        mountPath: '/downloads'
      - name: 'music'
        mountPath: '/music'

  volumes:
    config:
      persistentVolumeClaim:
        claimName: 'lidarr-config'
    # Your download client's directory and media library. Replace these with
    # the volumes that hold them - an emptyDir only keeps the app from
    # failing to start.
    downloads:
      emptyDir: {}
    music:
      emptyDir: {}

persistentVolumeClaims:
  lidarr-config:
    accessMode: 'ReadWriteOnce'
    requestStorage: '1Gi'
    selector: {}

ingress:
  enabled: true

metrics:
  enabled: false
  app: 'lidarr'
  port:
    number: 9702
