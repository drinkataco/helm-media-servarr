# yaml-language-server: $schema=../../values.schema.json
# Default library values
nameOverride: ''
fullnameOverride: ''

#
# Application Config
#
application:
  # Main application web UI port
  port: 8096
  # Access url base
  urlBase: 'jellyfin'
  # ConfigMap for core application settings
  config:
    # Network Options
    - filename: 'network.xml'
      contents: |
        <?xml version="1.0" encoding="utf-8"?>
        <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
          <BaseUrl>jellyfin</BaseUrl>
          <HttpServerPortNumber>8096</HttpServerPortNumber>
          <EnableHttps>false</EnableHttps>
          <PublicPort>8096</PublicPort>
          <EnableRemoteAccess>true</EnableRemoteAccess>
        </NetworkConfiguration>
      mountPath: '/config/config/network.xml'
    # System Options
    # - filename: 'system.xml'
    #   contents: |
    #     <?xml version="1.0" encoding="utf-8"?>
    #     <ServerConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
    #       <EnableMetrics>true</EnableMetrics>
    #       <PreferredMetadataLanguage>en</PreferredMetadataLanguage>
    #       <MetadataCountryCode>GB</MetadataCountryCode>
    #       <UICulture>en-GB</UICulture>
    #       <!-- Change me to false to run the setup wizard, but make sure you keep it true!! -->
    #       <IsStartupWizardCompleted>true</IsStartupWizardCompleted>
    #     </ServerConfiguration>
    #   mountPath: '/config/config/system.xml'

#
# Resource - DEPLOYMENT
# This is to set up and define the application deployment
#
deployment:

# For Nvidia transcoding support
  # nodeSelector:
  #   nvidia.com/gpu.present: "true"

  # runtimeClassName: "nvidia"

  # For DLNA/SSDP device discovery, which needs the host network
  # hostNetwork: true
  # dnsPolicy: 'ClusterFirstWithHostNet'

  container:
    image:
      repository: 'jellyfin/jellyfin'

    # PUID/PGID are honoured by lscr.io/linuxserver/jellyfin only, not by the
    # jellyfin/jellyfin image this chart defaults to. Use
    # deployment.podSecurityContext.fsGroup for volume ownership instead.
    env:
      - name: 'TZ'
        value: 'UTC'
      # For Nvidia transcoding support
      # - name: 'NVIDIA_VISIBLE_DEVICES'
      #   value: 'all'
      # - name: 'NVIDIA_DRIVER_CAPABILITIES'
      #   value: 'all'

    # Path matches <BaseUrl>jellyfin</BaseUrl> in network.xml above - change
    # both together, along with application.urlBase.
    #
    # Jellyfin scans its library on first start, which outlasts an ordinary
    # readiness window, so both probes are deliberately slack: liveness
    # tolerates ~5 minutes before restarting, readiness ~5 minutes before
    # giving up. Raise them further for a large library on slow storage.
    livenessProbe:
      httpGet:
        path: '/jellyfin/health'
        port: 'http'
      initialDelaySeconds: 120
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 10
    readinessProbe:
      httpGet:
        path: '/jellyfin/health'
        port: 'http'
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    # Additional volumeMounts on the output Deployment definition.
    volumeMounts:
      - name: 'config'
        mountPath: '/config'
      - name: 'ebooks'
        mountPath: '/ebooks'
      - name: 'film'
        mountPath: '/film'
      - name: 'music'
        mountPath: '/music'
      - name: 'television'
        mountPath: '/tv'

  volumes:
    config:
      persistentVolumeClaim:
        claimName: 'jellyfin-config'
    # Your media libraries. Replace these with the volumes that hold them - an
    # emptyDir only keeps Jellyfin from failing to start.
    ebooks:
      emptyDir: {}
    film:
      emptyDir: {}
    music:
      emptyDir: {}
    television:
      emptyDir: {}

persistentVolumeClaims:
  jellyfin-config:
    accessMode: 'ReadWriteOnce'
    requestStorage: '1Gi'
    selector: {}

ingress:
  enabled: true

# Metrics are enable within config - add <EnableMetrics>true</EnableMetrics> to /config/config/system.xml
# metrics:
#   enabled: false
