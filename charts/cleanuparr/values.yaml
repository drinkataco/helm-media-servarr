# yaml-language-server: $schema=../../values.schema.json
# Default library values
nameOverride: ''
fullnameOverride: ''

#
# Secrets to create
#
secrets:
  - name: 'apiKey'
    value: ''
    # ref: 'my-existing-secret' # existing secret
  # - name: 'sonarrApiKey'
  #   value: ''
  #   # ref: 'sonarr-api-secret' # existing secret
  # - name: 'radarrApiKey'
  #   value: ''
  #   # ref: 'radarr-api-secret' # existing secret

#
# Application Config
#
application:
  # Main application web UI port
  port: 11011
  # Access url base
  urlBase: 'cleanuparr'
  # Both answer 200 once the app is serving. Relative to urlBase.
  healthPath: '/health'
  readyPath: '/health/ready'
  config: null

#
# Resource - DEPLOYMENT
# This is to set up and define the application deployment
#
deployment:
  container:
    image:
      repository: 'ghcr.io/cleanuparr/cleanuparr'

    env:
      - name: 'PGID'
        value: '1000'
      - name: 'PUID'
        value: '1000'
      - name: 'TZ'
        value: 'UTC'

    # Additional volumeMounts on the output Deployment definition.
    volumeMounts:
      - name: 'config'
        mountPath: '/config'
      - name: 'downloads'
        mountPath: '/downloads'

  volumes:
    config:
      persistentVolumeClaim:
        claimName: 'cleanuparr-config'
    # Cleanuparr exists to remove failed and orphaned downloads, so it needs
    # the same download directory as your download client. Replace this with
    # that volume - an emptyDir gives it nothing to clean.
    downloads:
      emptyDir: {}

persistentVolumeClaims:
  cleanuparr-config:
    accessMode: 'ReadWriteOnce'
    requestStorage: '1Gi'
    selector: {}

ingress:
  enabled: true
